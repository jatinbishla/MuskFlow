[package]
name = "umless-context"
description = "What the user is typing into: the focused app and window, and the writing style it calls for"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
umless-cleanup.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXError", "AXValue"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFBase", "CFArray", "CFNumber"] }
