[package]
name = "umless-llm"
description = "Local LLM runtime for Umless (llama.cpp): prefix-cached prompts and prompt-lookup decoding"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
llama-cpp-2 = "0.1.160"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", features = ["metal"] }
