[package]
name = "umless-asr"
description = "Speech recognition backends and the streaming committer for Umless"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
umless-audio.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
sherpa-onnx = { workspace = true, features = ["shared"] }

[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = { workspace = true, features = ["static"] }
