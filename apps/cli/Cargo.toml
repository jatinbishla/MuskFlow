[package]
name = "muskflow-cli"
description = "MuskFlow from the terminal: app (hold Fn to dictate), listen, transcribe, bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "muskflow"
path = "src/main.rs"

[dependencies]
mf-audio.workspace = true
mf-asr.workspace = true
mf-eval.workspace = true
mf-models.workspace = true
mf-llm.workspace = true
mf-cleanup.workspace = true
mf-hotkey.workspace = true
mf-insert.workspace = true
mf-shell.workspace = true
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
