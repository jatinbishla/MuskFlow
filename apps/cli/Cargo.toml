[package]
name = "umless-cli"
description = "Umless from the terminal: app (hold Fn to dictate), listen, transcribe, bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "umless"
path = "src/main.rs"

[dependencies]
umless-audio.workspace = true
umless-asr.workspace = true
umless-eval.workspace = true
umless-models.workspace = true
umless-llm.workspace = true
umless-cleanup.workspace = true
umless-hotkey.workspace = true
umless-insert.workspace = true
umless-shell.workspace = true
umless-context.workspace = true
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
env_logger.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
